services:
  - type: web
    name: pmis-vle-app
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PMIS_SECRET
        generateValue: true
      - key: PMIS_PINS
        sync: false
      - key: PMIS_ADMIN_PIN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
