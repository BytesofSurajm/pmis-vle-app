<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PMIS VLE Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Baloo+Tamma+2:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one long, calm page that reads like a road - who you have -> where they are on the road -> each person. */
:root{
  --ground:#EEF2EC; --surface:#FFFFFF; --surface-2:#F6F8F4; --ink:#16241F; --muted:#56655F; --line:#D5DDD3;
  --accent:#C9761A; --accent-ink:#FFFFFF; --road:#33423D; --road-dash:#F3E2B8; --focus:#1F6FEB;
  --s1:#6F7F8C; --s2:#2F6FC9; --s3:#7D52BF; --s4:#C9761A; --s5:#0B8B97; --s6:#24913F;
  --s1-bg:#E7ECEF; --s2-bg:#E3EDFA; --s3-bg:#EFE8F8; --s4-bg:#FAEEDD; --s5-bg:#DFF2F3; --s6-bg:#E1F2E5;
  --shadow:0 1px 2px rgba(22,36,31,.06),0 6px 20px rgba(22,36,31,.06);
  --f-display:"Baloo 2","Baloo Tamma 2","Noto Sans Devanagari","Noto Sans Kannada",system-ui,sans-serif;
  --f-body:"Baloo 2","Baloo Tamma 2","Noto Sans Devanagari","Noto Sans Kannada",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0F1714; --surface:#17221E; --surface-2:#1C2924; --ink:#E8EFEA; --muted:#9DB0A7; --line:#2A3A34;
  --accent:#E8A04A; --accent-ink:#1A1206; --road:#C9D4CE; --road-dash:#4A5A53; --focus:#6EA8FF;
  --s1:#9AABB8; --s2:#6FA3F0; --s3:#AE8AE8; --s4:#E8A04A; --s5:#3CC3CE; --s6:#55C774;
  --s1-bg:#22302F; --s2-bg:#1B2B42; --s3-bg:#2A2340; --s4-bg:#3A2A14; --s5-bg:#123236; --s6-bg:#16331F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0F1714; --surface:#17221E; --surface-2:#1C2924; --ink:#E8EFEA; --muted:#9DB0A7; --line:#2A3A34;
  --accent:#E8A04A; --accent-ink:#1A1206; --road:#C9D4CE; --road-dash:#4A5A53; --focus:#6EA8FF;
  --s1:#9AABB8; --s2:#6FA3F0; --s3:#AE8AE8; --s4:#E8A04A; --s5:#3CC3CE; --s6:#55C774;
  --s1-bg:#22302F; --s2-bg:#1B2B42; --s3-bg:#2A2340; --s4-bg:#3A2A14; --s5-bg:#123236; --s6-bg:#16331F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:12px;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;margin-right:auto}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--road);color:var(--ground);display:grid;place-items:center}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;line-height:1}
.langs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;border-radius:999px;padding:4px 12px;font-weight:600;font-size:16px;min-height:38px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;min-height:44px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:20px;padding:10px 26px;min-height:56px}
.btn .i{font-size:20px}

/* login */
.login{min-height:calc(100vh - 90px);display:grid;place-items:center;padding-block:32px}
.login-card{width:100%;max-width:480px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:28px;display:grid;gap:18px}
.login-art{display:flex;align-items:flex-end;gap:6px;height:70px;color:var(--muted)}
.login-art span{display:block;border-radius:6px 6px 0 0;width:100%}
.login h1{font-size:30px}
.field{display:grid;gap:6px}
.field label{font-weight:600;color:var(--muted)}
.field input{width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 16px;font-size:24px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.field input:focus{border-color:var(--focus);outline:none}
.err{color:#B3261E;font-weight:600;min-height:1.4em}
:root[data-theme="dark"] .err{color:#FF8A80}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#FF8A80}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px dashed var(--line);background:var(--surface-2);border-radius:999px;padding:6px 14px;font-family:var(--f-mono);font-size:15px;min-height:40px}
.hint{color:var(--muted);font-size:15px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;padding-block:24px 8px;align-items:stretch}
.hello{display:grid;gap:14px;align-content:start}
.hello .who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:15px}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big b{font-family:var(--f-display);font-size:clamp(64px,10vw,104px);line-height:.9;font-weight:800}
.big span{font-size:22px;font-weight:600;max-width:16ch;line-height:1.2}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tri div{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;border-top:5px solid var(--c)}
.tri b{font-family:var(--f-display);font-size:34px;line-height:1}
.tri span{font-size:15px;color:var(--muted);font-weight:600;line-height:1.2}
.crowd{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:grid;gap:12px;align-content:start}
.crowd-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.crowd-head h2{font-size:20px}
.figs{display:flex;flex-wrap:wrap;gap:4px}
.figs svg{width:22px;height:28px}
.figs.md svg{width:30px;height:38px}
.figs.lg svg{width:40px;height:50px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.goal{display:flex;align-items:center;gap:14px;background:var(--s6-bg);border-radius:var(--r);padding:12px 14px}
.goal svg{width:64px;height:64px;flex:none}
.goal p{margin:0;font-weight:600;font-size:18px;line-height:1.25}

/* road */
.section{padding-block:22px 6px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-size:28px}
.sec-head p{margin:0;color:var(--muted)}
.road{position:relative;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:22px 18px 18px}
.road ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;position:relative}
.road ol::before{content:"";position:absolute;left:8%;right:8%;top:38px;height:12px;border-radius:12px;background:var(--road);
  background-image:repeating-linear-gradient(90deg,transparent 0 14px,var(--road-dash) 14px 26px);background-size:100% 2px;background-repeat:no-repeat;background-position:0 5px}
.stop{position:relative;display:grid;justify-items:center;text-align:center;gap:4px;border:2px solid transparent;background:transparent;border-radius:16px;padding:0 4px 10px;width:100%}
.stop:hover{background:var(--surface-2)}
.stop[aria-pressed="true"]{border-color:var(--c);background:var(--cbg)}
.stop .dot{width:88px;height:88px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;border:6px solid var(--surface);box-shadow:0 0 0 2px var(--c);position:relative}
:root[data-theme="dark"] .stop .dot{color:#0F1714}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stop .dot{color:#0F1714}}
.stop .dot svg{width:38px;height:38px;stroke-width:2.2}
.stop .step{position:absolute;top:-6px;right:-6px;background:var(--ink);color:var(--ground);border-radius:999px;font-size:13px;font-weight:700;min-width:26px;height:26px;display:grid;place-items:center;border:2px solid var(--surface)}
.stop b{font-family:var(--f-display);font-size:40px;line-height:1;margin-top:6px;color:var(--c)}
.stop .lbl{font-weight:600;font-size:15px;line-height:1.15;min-height:2.3em}
.stop .pct{font-size:13px;color:var(--muted)}
.stop.zero{opacity:.55}
.bar100{display:flex;height:16px;border-radius:999px;overflow:hidden;margin-top:14px;background:var(--surface-2)}
.bar100 i{display:block;height:100%;background:var(--c)}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.side{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
.panel{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:grid;gap:10px}
.panel h3{font-size:20px;display:flex;align-items:center;gap:8px}
.co{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:4px;border-radius:10px;width:100%}
.co:hover,.co[aria-pressed="true"]{background:var(--surface-2)}
.co[aria-pressed="true"]{outline:2px solid var(--ink)}
.co .lm{width:34px;height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:15px}
.co .nm{font-weight:600;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co .sb{display:flex;height:8px;border-radius:999px;overflow:hidden;margin-top:4px;background:var(--surface-2)}
.co .sb i{background:var(--c)}
.co b{font-family:var(--f-display);font-size:22px}
.more{border:0;background:transparent;color:var(--accent);font-weight:700;justify-self:start;padding:4px}
.pj{display:flex;flex-wrap:wrap;gap:8px}
.pj button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:6px 12px;display:grid;text-align:left;min-width:92px}
.pj button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.pj b{font-family:var(--f-display);font-size:24px;line-height:1}
.pj span{font-family:var(--f-mono);font-size:13px}

/* finder + list */
.finder{display:flex;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:6px 8px 6px 16px}
.finder:focus-within{border-color:var(--focus)}
.finder .i{font-size:24px;color:var(--muted)}
.finder input{flex:1;min-width:0;border:0;background:transparent;font-size:19px;padding:10px 0;outline:none}
.active{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;min-height:34px}
.active .count{font-weight:700;font-size:18px;margin-right:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:4px 8px 4px 12px;background:var(--cbg,var(--surface-2));color:var(--ink);font-weight:600;font-size:15px}
.pill .x{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border-radius:18px;padding:14px;display:grid;gap:10px;border:0;text-align:left;box-shadow:var(--shadow);border-left:6px solid var(--c);width:100%}
.card:hover{transform:translateY(-1px)}
.card .row{display:flex;gap:12px;align-items:center;min-width:0}
.av{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;background:var(--cbg);color:var(--c)}
.card h3{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cmp{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:15px;min-width:0}
.card .cmp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.track i{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.track i.on{background:var(--c);border-color:var(--c)}
.now{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--cbg);color:var(--c);border-radius:999px;padding:3px 12px 3px 8px;font-weight:700;font-size:15px}
.badge svg{font-size:18px}
.ids{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;color:var(--muted)}
.ids .mono{color:var(--ink);font-size:14px;overflow-wrap:anywhere}
.empty{background:var(--surface);border-radius:18px;padding:28px;text-align:center;color:var(--muted);font-weight:600;grid-column:1/-1}

/* detail dialog */
dialog{border:0;padding:0;border-radius:24px;max-width:560px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,16,.55)}
.dl{padding:22px;display:grid;gap:16px;max-height:88vh;overflow:auto}
.dl-head{display:flex;gap:14px;align-items:center}
.dl-head .av{width:72px;height:72px;font-size:28px}
.dl-head h2{font-size:28px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;position:relative;padding-block:6px}
.steps li::before{content:"";position:absolute;left:23px;top:-6px;bottom:50%;width:3px;background:var(--line)}
.steps li:first-child::before{display:none}
.steps li.done::before,.steps li.cur::before{background:var(--c)}
.steps .d{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--line);background:var(--surface);color:var(--muted);position:relative;z-index:1}
.steps .d svg{width:22px;height:22px}
.steps li.done .d{background:var(--c);border-color:var(--c);color:var(--surface)}
.steps li.cur .d{background:var(--c);border-color:var(--c);color:var(--surface);box-shadow:0 0 0 6px var(--cbg);width:48px;height:48px}
.steps li span{font-weight:600}
.steps li.up span{color:var(--muted);font-weight:500}
.steps li.cur span{font-size:20px;font-weight:800;color:var(--c)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.facts div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.facts span{font-size:13px;color:var(--muted);font-weight:600}
.facts b{font-size:16px;overflow-wrap:anywhere}
.dl-foot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}

/* admin */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.vcard{background:var(--surface);border:0;border-radius:18px;padding:16px;text-align:left;display:grid;gap:8px;box-shadow:var(--shadow)}
.vcard b{font-family:var(--f-display);font-size:30px;line-height:1}
.upload{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:14px;color:var(--muted)}
.foot{color:var(--muted);font-size:14px;padding-top:28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

@media (max-width:960px){
  .hero{grid-template-columns:1fr}
  .main{grid-template-columns:1fr}
  .side{position:static;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
}
@media (max-width:760px){
  .road ol{grid-template-columns:1fr;gap:6px}
  .road ol::before{left:36px;right:auto;top:30px;bottom:30px;width:12px;height:auto;background-image:none}
  .stop{grid-template-columns:88px 1fr auto;justify-items:start;text-align:left;align-items:center;gap:14px;padding:4px 10px 4px 0}
  .stop b{margin:0;grid-column:3;grid-row:1}
  .stop .lbl{min-height:0;font-size:17px}
  .stop .txt{grid-column:2;grid-row:1}
  .stop .dot{width:84px;height:84px}
  .sec-head h2{font-size:24px}
}
@media (max-width:480px){
  body{font-size:16px}
  .tri b{font-size:28px}
  .tri span{font-size:13px}
  .figs.lg svg{width:30px;height:38px}
  .figs.md svg{width:24px;height:30px}
  .brand small{display:none}
  .langs button{padding:4px 9px}
}
@media (prefers-reduced-motion:no-preference){
  .card{transition:transform .15s}
  .figs svg{animation:pop .35s both}
  @keyframes pop{from{transform:translateY(4px)}to{transform:none}}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span class="mark"><svg class="i" viewBox="0 0 24 24" style="font-size:22px"><path d="M4 20 10 4h4l6 16"/><path d="M12 8v2M12 13v2M12 18v2"/></svg></span>
    <div><span data-t="appName"></span><small>PMIS · VLE</small></div></div>
  <div class="langs" role="group" aria-label="Language" id="langs"></div>
  <button class="btn" id="speak" hidden><svg class="i" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><span data-t="listen"></span></button>
  <button class="btn" id="logout" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4M6 12h11"/></svg><span data-t="logout"></span></button>
</div></header>

<main class="wrap" id="app"></main>

<dialog id="dlg"><div class="dl" id="dlgBody"></div></dialog>

<script>
(() => {
"use strict";
/* ---------- config ---------- */
const DEMO = window.PMIS_DEMO || null;          // embedded data -> demo mode (no server)
const STAGE_KEYS = ["Applied","Shortlisted","Offer Letter Received","Offer Letter Accepted","Accepted","Joined"];
const ICONS = {
  person:'<circle cx="12" cy="7" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
  s1:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h4"/>',

const sess = {get(k){try{return sessionStorage.getItem(k)}catch(e){return null}}, set(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};
const S = {lang: T[store.get("pmis.lang")] ? store.get("pmis.lang") : "en", token: sess.get("pmis.token"), role: sess.get("pmis.role"),
  data:null, vles:null, filter:{stage:null, company:null, project:null, q:""}, coAll:false, err:""};
const t = (k, vars={}) => String(T[S.lang][k] ?? T.en[k]).replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? "");
const stLabel = i => T[S.lang].st[i];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stageIdx = s => Math.max(0, STAGE_KEYS.indexOf(s));
const cv = i => `--c:var(--s${i+1});--cbg:var(--s${i+1}-bg)`;

const $ = s => document.querySelector(s);
const app = $("#app");

/* ---------- data access (server or demo) ---------- */
const api = {
  async login(vle, pin){
    if (DEMO){
      if (vle === "ADMIN") return {token:"demo", role:"admin", vle_id:"ADMIN"};
      if (!DEMO.applications.some(a => a.vle_id === vle)) throw {status:401};
      return {token:"demo", role:"vle", vle_id:vle};
    }
    const r = await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vle_id:vle,pin})});
    if (!r.ok) throw {status:r.status};
    return r.json();
  },
  async dashboard(vle){
    if (DEMO){
      const target = S.role === "admin" ? vle : S.me;
      const apps = DEMO.applications.filter(a => a.vle_id === target).sort((a,b)=>a.candidate_name.localeCompare(b.candidate_name));
      return {vle:{vle_id:target, location:apps[0]?.vle_location||""}, stages:STAGE_KEYS, applications:apps, updated:DEMO.updated};
    }
    return this._get("/api/dashboard" + (vle ? "?vle="+encodeURIComponent(vle) : ""));
  },
  async vles(){
    if (DEMO){
      const m = new Map();
      DEMO.applications.forEach(a => { const v = m.get(a.vle_id) || {vle_id:a.vle_id, location:a.vle_location, records:0, joined:0}; v.records++; if (a.status==="Joined") v.joined++; m.set(a.vle_id, v); });
      return [...m.values()].sort((a,b)=>a.vle_id.localeCompare(b.vle_id));
    }
    return this._get("/api/vles");
  },
  async upload(file){
    const fd = new FormData(); fd.append("file", file);
    const r = await fetch("/api/admin/import",{method:"POST",headers:{Authorization:"Bearer "+S.token},body:fd});
    const j = await r.json(); if (!r.ok) throw new Error(j.detail || "Upload failed"); return j;
  },
  async _get(url){
    const r = await fetch(url,{headers:{Authorization:"Bearer "+S.token}});
    if (r.status === 401){ logout(); throw {status:401}; }
    if (!r.ok) throw {status:r.status};
    return r.json();
  }
};
S.me = sess.get("pmis.me");

/* ---------- chrome ---------- */
function renderChrome(){
  document.documentElement.lang = S.lang;
  $("#langs").innerHTML = Object.keys(T).map(k => `<button data-lang="${k}" aria-pressed="${k===S.lang}" lang="${k}">${T[k].name}</button>`).join("");
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  const inside = !!S.token;
  $("#logout").hidden = !inside;
  $("#speak").hidden = !(inside && S.data);
}
$("#langs").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if(!b) return; S.lang = b.dataset.lang; store.set("pmis.lang", S.lang); render(); });
$("#logout").addEventListener("click", logout);
$("#speak").addEventListener("click", () => { if (S.data) speak(summarySpeech()); });

function logout(){ S.token=null; S.role=null; S.me=null; S.data=null; S.vles=null; ["pmis.token","pmis.role","pmis.me"].forEach(k=>sess.set(k,null)); resetFilters(); render(); }
function resetFilters(){ S.filter = {stage:null, company:null, project:null, q:""}; S.coAll=false; }

function speak(text){
  try{
    const synth = window.speechSynthesis; if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const want = T[S.lang].speech, voices = synth.getVoices();
    const v = voices.find(x => x.lang === want) || voices.find(x => x.lang.startsWith(want.slice(0,2))) ||
              (S.lang==="mr" && voices.find(x => x.lang.startsWith("hi")));
    if (v) u.voice = v; u.lang = v ? v.lang : want; u.rate = .92;
    synth.speak(u);
  }catch(e){}
}

/* ---------- login ---------- */
function renderLogin(){
  const ids = DEMO ? [...new Set(DEMO.applications.map(a=>a.vle_id))].sort() : [];
  app.innerHTML = `
  <section class="login"><form class="login-card" id="loginForm" autocomplete="off">
    <div class="login-art" aria-hidden="true">${[1,2,3,4,5,6].map(i=>`<span style="height:${18+i*8}px;background:var(--s${i})"></span>`).join("")}</div>
    <h1>${t("loginTitle")}</h1>
    <div class="field"><label for="vleIn">${t("vleLabel")}</label>
      <input id="vleIn" inputmode="text" placeholder="VLEKA20261" required></div>
    ${DEMO ? "" : `<div class="field"><label for="pinIn">${t("pinLabel")}</label>
      <input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••" required></div>`}
    <div class="err" role="alert" id="loginErr">${esc(S.err)}</div>
    <button class="btn primary" type="submit">${t("open")} ${ic("back").replace('class="i"','class="i" style="transform:rotate(180deg)"')}</button>
    ${DEMO ? `<div class="hint">${t("demoHint")}</div><div class="chips">${ids.map(id=>`<button type="button" class="chip" data-id="${id}">${id}</button>`).join("")}
      <button type="button" class="chip" data-id="ADMIN">${t("adminTry")}</button></div>` : ""}
  </form></section>`;
  const f = $("#loginForm");
  f.addEventListener("submit", e => { e.preventDefault(); doLogin($("#vleIn").value, $("#pinIn")?.value || ""); });
  f.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { $("#vleIn").value = c.dataset.id; doLogin(c.dataset.id, ""); }));
}
async function doLogin(vle, pin){
  vle = vle.trim().toUpperCase(); S.err = "";
  try{
    const r = await api.login(vle, pin);
    S.token = r.token; S.role = r.role; S.me = r.vle_id;
    sess.set("pmis.token", r.token); sess.set("pmis.role", r.role); sess.set("pmis.me", r.vle_id);
    await load();
  }catch(e){
    S.err = e.status === 429 ? t("tooMany") : e.status === 401 ? t("wrong") : t("netErr");
    render(); $("#vleIn") && ($("#vleIn").value = vle);
  }
}
async function load(vle){
  try{
    if (S.role === "admin" && !vle){ S.data = null; S.vles = await api.vles(); }
    else { S.data = await api.dashboard(vle); resetFilters(); }
  }catch(e){ if (e.status !== 401){ S.err = t("netErr"); } }
  render(); window.scrollTo({top:0});
}

/* ---------- dashboard ---------- */
function stats(apps){
  const counts = STAGE_KEYS.map(()=>0); apps.forEach(a => counts[stageIdx(a.status)]++);
  const people = new Set(apps.map(a=>a.candidate_id)).size;
  return {counts, people, records:apps.length, joined:counts[5], onway:counts[1]+counts[2]+counts[3]+counts[4], applied:counts[0]};
}
function summarySpeech(){
  const s = stats(S.data.applications);
  return t("say",{n:s.people,j:s.joined,o:s.onway,a:s.applied});
}
function ring(j, n){
  const r = 26, c = 2*Math.PI*r, p = n ? j/n : 0;
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--surface)" stroke-width="9"/>
   <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--s6)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/>
   <text x="32" y="37" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)" font-family="Baloo 2, sans-serif">${Math.round(p*100)}%</text></svg>`;
}
function renderDashboard(){
  const D = S.data, apps = D.applications, s = stats(apps);
  const sorted = [...apps].sort((a,b)=>stageIdx(b.status)-stageIdx(a.status));
  const max = Math.max(1,...s.counts);
  // companies
  const coMap = new Map();
  apps.forEach(a => { const k=a.company_name||"—"; const v=coMap.get(k)||{n:0,c:[0,0,0,0,0,0]}; v.n++; v.c[stageIdx(a.status)]++; coMap.set(k,v); });
  const cos = [...coMap.entries()].sort((a,b)=>b[1].n-a[1].n || a[0].localeCompare(b[0]));
  const shownCos = S.coAll ? cos : cos.slice(0,7);
  const pjMap = new Map(); apps.forEach(a => pjMap.set(a.project_code||"—",(pjMap.get(a.project_code||"—")||0)+1));
  const pjs = [...pjMap.entries()].sort((a,b)=>a[0].localeCompare(b[0]));

  app.innerHTML = `
  ${S.role==="admin" ? `<div style="padding-top:16px"><button class="btn" id="backAll">${ic("back")} All VLEs</button></div>` : ""}
  <section class="hero">
    <div class="hello">
      <div class="who"><span>${t("hello")} 🙏</span><span class="tag mono">${esc(D.vle.vle_id)}</span><span class="tag">${ic("pin")} ${esc(D.vle.location)}</span></div>
      <div class="big"><b class="num">${s.people}</b><span>${t("people")}</span></div>
      <div class="tri">
        <div style="--c:var(--s6)"><b class="num">${s.joined}</b><span>${t("joined")}</span></div>
        <div style="--c:var(--s3)"><b class="num">${s.onway}</b><span>${t("onway")}</span></div>
        <div style="--c:var(--s1)"><b class="num">${s.applied}</b><span>${t("applied")}</span></div>
      </div>
      <div class="goal">${ring(s.joined, s.records)}<p>${t("goal",{j:s.joined,n:s.records})}</p></div>
    </div>
    <div class="crowd">
      <div class="crowd-head"><h2>${t("crowdTitle")}</h2>${s.records!==s.people?`<span class="hint">${t("apps",{n:s.records})}</span>`:""}</div>
      <div class="figs ${s.records<=40?"lg":s.records<=90?"md":""}" role="img" aria-label="${esc(t("say",{n:s.people,j:s.joined,o:s.onway,a:s.applied}))}">
        ${sorted.map((a,k)=>`<svg viewBox="0 0 24 30" style="color:var(--s${stageIdx(a.status)+1});animation-delay:${Math.min(k*12,600)}ms"><title>${esc(a.candidate_name)} · ${esc(stLabel(stageIdx(a.status)))}</title><circle cx="12" cy="7" r="5" fill="currentColor"/><path d="M3 29c0-6 4-11 9-11s9 5 9 11z" fill="currentColor"/></svg>`).join("")}
      </div>
      <div class="legend">${STAGE_KEYS.map((_,i)=>`<span style="${cv(i)}"><i></i>${stLabel(i)}</span>`).join("")}</div>
    </div>
  </section>

  <section class="section" aria-labelledby="jh">
    <div class="sec-head"><h2 id="jh">${t("journey")}</h2><p>${t("tapStop")}</p></div>
    <div class="road">
      <ol>${STAGE_KEYS.map((_,i)=>`<li><button class="stop ${s.counts[i]?"":"zero"}" data-stage="${i}" aria-pressed="${S.filter.stage===i}" style="${cv(i)}">
        <span class="dot">${ic("s"+(i+1))}<span class="step">${i+1}</span></span>
        <span class="txt"><span class="lbl">${stLabel(i)}</span><br><span class="pct num">${s.records?Math.round(s.counts[i]/s.records*100):0}%</span></span>
        <b class="num">${s.counts[i]}</b></button></li>`).join("")}</ol>
      <div class="bar100" aria-hidden="true">${s.counts.map((c,i)=>c?`<i style="${cv(i)};width:${c/s.records*100}%"></i>`:"").join("")}</div>
    </div>
  </section>

  <section class="section main">
    <div>
      <div class="sec-head"><h2>${t("find")}</h2></div>
      <label class="finder" for="q">${ic("search")}<span class="sr">${t("find")}</span>
        <input id="q" type="search" placeholder="${esc(t("findPh"))}" value="${esc(S.filter.q)}" autocomplete="off"></label>
      <div class="active" id="active"></div>
      <div class="cards" id="cards"></div>
    </div>
    <aside class="side">
      <div class="panel"><h3>${ic("building")} ${t("companies")}</h3>
        ${shownCos.map(([name,v])=>`<button class="co" data-co="${esc(name)}" aria-pressed="${S.filter.company===name}">
          <span class="lm">${esc(initials(name))}</span>
          <span style="min-width:0"><span class="nm" style="display:block">${esc(name)}</span>
          <span class="sb">${v.c.map((c,i)=>c?`<i style="${cv(i)};width:${c/v.n*100}%"></i>`:"").join("")}</span></span>
          <b class="num">${v.n}</b></button>`).join("")}
        ${cos.length>7?`<button class="more" id="coMore">${S.coAll?t("less"):t("more")+" ("+cos.length+")"}</button>`:""}
      </div>
      <div class="panel"><h3>${t("projects")}</h3>
        <div class="pj">${pjs.map(([p,n])=>`<button data-pj="${esc(p)}" aria-pressed="${S.filter.project===p}"><b class="num">${n}</b><span>${esc(p)}</span></button>`).join("")}</div>
      </div>
    </aside>
  </section>
  <div class="foot"><span>${t("updated")}: ${esc(D.updated||"—")}</span><span>PMIS · VLE ${esc(D.vle.vle_id)}</span></div>`;

  app.querySelectorAll(".stop").forEach(b => b.addEventListener("click", () => { const i=+b.dataset.stage; S.filter.stage = S.filter.stage===i?null:i; refresh(); }));
  app.querySelectorAll(".co").forEach(b => b.addEventListener("click", () => { const c=b.dataset.co; S.filter.company = S.filter.company===c?null:c; refresh(); }));
  app.querySelectorAll("[data-pj]").forEach(b => b.addEventListener("click", () => { const p=b.dataset.pj; S.filter.project = S.filter.project===p?null:p; refresh(); }));
  $("#coMore")?.addEventListener("click", () => { S.coAll=!S.coAll; render(); });
  $("#backAll")?.addEventListener("click", () => load());
  $("#q").addEventListener("input", e => { S.filter.q = e.target.value; renderList(); });
  renderList();
}
function refresh(){ // keep scroll + search focus, re-render pressed states & list
  app.querySelectorAll(".stop").forEach(b => b.setAttribute("aria-pressed", S.filter.stage===+b.dataset.stage));
  app.querySelectorAll(".co").forEach(b => b.setAttribute("aria-pressed", S.filter.company===b.dataset.co));
  app.querySelectorAll("[data-pj]").forEach(b => b.setAttribute("aria-pressed", S.filter.project===b.dataset.pj));
  renderList();
  $("#q").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}
function filtered(){
  const f = S.filter, q = f.q.trim().toLowerCase();
  return S.data.applications.filter(a =>
    (f.stage===null || stageIdx(a.status)===f.stage) &&
    (f.company===null || (a.company_name||"—")===f.company) &&
    (f.project===null || (a.project_code||"—")===f.project) &&
    (!q || a.candidate_name.toLowerCase().includes(q) || a.candidate_id.toLowerCase().includes(q) || a.internship_id.toLowerCase().includes(q))
  ).sort((a,b)=>stageIdx(b.status)-stageIdx(a.status) || a.candidate_name.localeCompare(b.candidate_name));
}
function renderList(){
  const list = filtered(), f = S.filter;
  const pills = [];
  if (f.stage!==null) pills.push(`<button class="pill" data-clear="stage" style="${cv(f.stage)}">${stLabel(f.stage)}<span class="x">${ic("x")}</span></button>`);
  if (f.company) pills.push(`<button class="pill" data-clear="company">${esc(f.company)}<span class="x">${ic("x")}</span></button>`);
  if (f.project) pills.push(`<button class="pill" data-clear="project">${esc(f.project)}<span class="x">${ic("x")}</span></button>`);
  $("#active").innerHTML = `<span class="count">${t("showing",{n:list.length})}</span>${pills.length?pills.join(""):`<span class="hint">· ${t("everyone")}</span>`}`;
  $("#active").querySelectorAll("[data-clear]").forEach(b => b.addEventListener("click", () => { S.filter[b.dataset.clear] = null; refresh(); }));
  $("#cards").innerHTML = list.length ? list.map((a)=>{ const i=stageIdx(a.status); const k=S.data.applications.indexOf(a); return `
    <button class="card" data-k="${k}" style="${cv(i)}">
      <span class="row"><span class="av">${esc(initials(a.candidate_name))}</span>
        <span style="min-width:0;display:grid"><h3>${esc(a.candidate_name)}</h3><span class="cmp">${ic("building")}<span>${esc(a.company_name)}</span></span></span></span>
      <span class="track" aria-hidden="true">${STAGE_KEYS.map((_,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</span>
      <span class="now"><span class="badge">${ic("s"+(i+1))}${stLabel(i)}</span><span class="hint">${t("step",{i:i+1})}</span></span>
      <span class="ids"><span>${t("candId")}</span><span class="mono">${esc(a.candidate_id)}</span><span>${t("internId")}</span><span class="mono">${esc(a.internship_id)}</span></span>
    </button>`}).join("") : `<div class="empty">${t("none")}</div>`;
  $("#cards").querySelectorAll(".card").forEach(c => c.addEventListener("click", () => openPerson(S.data.applications[+c.dataset.k])));
}
function openPerson(a){
  const i = stageIdx(a.status);
  $("#dlgBody").innerHTML = `
    <div class="dl-head" style="${cv(i)}"><span class="av">${esc(initials(a.candidate_name))}</span>
      <div style="min-width:0"><h2>${esc(a.candidate_name)}</h2><span class="cmp hint" style="display:flex;gap:6px;align-items:center">${ic("building")} ${esc(a.company_name)}</span></div></div>
    <ol class="steps">${STAGE_KEYS.map((_,j)=>`<li class="${j<i?"done":j===i?"cur":"up"}" style="${cv(i)}"><span class="d">${ic("s"+(j+1))}</span><span>${stLabel(j)}</span></li>`).join("")}</ol>
    <p style="margin:0;font-weight:700;color:var(--s${i+1})">${i===5?t("done"):t("next",{s:stLabel(i+1)})}</p>
    <div class="facts">
      <div><span>${t("candId")}</span><b class="mono">${esc(a.candidate_id)}</b></div>
      <div><span>${t("internId")}</span><b class="mono">${esc(a.internship_id)}</b></div>
      <div><span>${t("company")}</span><b>${esc(a.company_name)}</b></div>
      <div><span>${t("project")}</span><b class="mono">${esc(a.project_code)}</b></div>
      <div><span>${t("vleId")}</span><b class="mono">${esc(a.vle_id)}</b></div>
      <div><span>${t("location")}</span><b>${esc(a.vle_location)}</b></div>
    </div>
    <div class="dl-foot"><button class="btn" id="dSpeak">${ic("speak")} ${t("listen")}</button><button class="btn primary" id="dClose">${t("close")}</button></div>`;
  const d = $("#dlg");
  $("#dClose").onclick = () => d.close();
  $("#dSpeak").onclick = () => speak(t("sayOne",{name:a.candidate_name,c:a.company_name,i:i+1,s:stLabel(i)}));
  d.onclick = e => { if (e.target === d) d.close(); };
  d.showModal ? d.showModal() : d.setAttribute("open","");
}

/* ---------- admin ---------- */
function renderAdmin(){
  const v = S.vles || [];
  app.innerHTML = `
  <section class="section">
    <div class="sec-head"><h2>Choose a VLE</h2><p>${v.length} VLEs · ${v.reduce((a,b)=>a+b.records,0)} application records</p></div>
    <div class="vgrid">${v.map(x=>`<button class="vcard" data-v="${esc(x.vle_id)}">
      <span class="mono" style="font-size:18px;font-weight:600">${esc(x.vle_id)}</span>
      <span class="hint" style="display:flex;gap:6px;align-items:center">${ic("pin")} ${esc(x.location)}</span>
      <span style="display:flex;gap:18px"><span><b class="num">${x.records}</b><br><span class="hint">records</span></span>
      <span><b class="num" style="color:var(--s6)">${x.joined||0}</b><br><span class="hint">joined</span></span></span></button>`).join("")}</div>
  </section>
  <section class="section"><div class="panel">
    <h3>${ic("up")} Upload new PMIS Excel</h3>
    <p class="note" style="margin:0">Replaces all application records. Needs a sheet with headers: Candidate Id, Candidate Name, Internship Id, Company Name, Application Status, VLE ID, VLE Location, Project Code. New VLEs get a PIN in <span class="mono">data/new_vle_pins.csv</span>.</p>
    <div class="upload"><input type="file" id="xl" accept=".xlsx"><button class="btn" id="upBtn" ${DEMO?"disabled":""}>Upload</button></div>
    <div class="note" id="upMsg">${DEMO?"Upload works when the app runs on the server.":""}</div>
  </div></section>`;
  app.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => load(b.dataset.v)));
  $("#upBtn").addEventListener("click", async () => {
    const f = $("#xl").files[0]; if (!f) return;
    $("#upMsg").textContent = "Uploading…";
    try{ const r = await api.upload(f); $("#upMsg").textContent = `Loaded ${r.rows} records for ${r.vles} VLEs (${r.new_vles} new).` + (r.warnings.length?` Warnings: ${r.warnings.slice(0,5).join("; ")}`:""); S.vles = await api.vles(); setTimeout(()=>renderAdmin(),1500);}
    catch(e){ $("#upMsg").textContent = e.message; }
  });
}

/* ---------- router ---------- */
function render(){
  renderChrome();
  if (!S.token) return renderLogin();
  if (S.data) return renderDashboard();
  if (S.role === "admin" && S.vles) return renderAdmin();
  app.innerHTML = `<p class="hint" style="padding:40px 0">…</p>`;
}
if ("speechSynthesis" in window) speechSynthesis.getVoices();
render();
if (S.token) load();
})();
</script>
</body>
