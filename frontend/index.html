<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PMIS CSC Project</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Baloo+Tamma+2:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one calm page read top-down - who you are -> three headline numbers -> the road of six steps -> each candidate. */
:root{
  --ground:#EEF2EC; --surface:#FFFFFF; --surface-2:#F6F8F4; --ink:#16241F; --muted:#56655F; --line:#D5DDD3;
  --accent:#C9761A; --accent-ink:#FFFFFF; --road:#33423D; --road-dash:#F3E2B8; --focus:#1F6FEB; --danger:#B3261E;
  --s1:#6F7F8C; --s2:#2F6FC9; --s3:#7D52BF; --s4:#C9761A; --s5:#0B8B97; --s6:#24913F;
  --s1-bg:#E7ECEF; --s2-bg:#E3EDFA; --s3-bg:#EFE8F8; --s4-bg:#FAEEDD; --s5-bg:#DFF2F3; --s6-bg:#E1F2E5;
  --shadow:0 1px 2px rgba(22,36,31,.06),0 6px 20px rgba(22,36,31,.06);
  --f-display:"Baloo 2","Baloo Tamma 2","Noto Sans Devanagari","Noto Sans Kannada",system-ui,sans-serif;
  --f-body:"Baloo 2","Baloo Tamma 2","Noto Sans Devanagari","Noto Sans Kannada",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0F1714; --surface:#17221E; --surface-2:#1C2924; --ink:#E8EFEA; --muted:#9DB0A7; --line:#2A3A34;
  --accent:#E8A04A; --accent-ink:#1A1206; --road:#C9D4CE; --road-dash:#4A5A53; --focus:#6EA8FF; --danger:#FF8A80;
  --s1:#9AABB8; --s2:#6FA3F0; --s3:#AE8AE8; --s4:#E8A04A; --s5:#3CC3CE; --s6:#55C774;
  --s1-bg:#22302F; --s2-bg:#1B2B42; --s3-bg:#2A2340; --s4-bg:#3A2A14; --s5-bg:#123236; --s6-bg:#16331F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0F1714; --surface:#17221E; --surface-2:#1C2924; --ink:#E8EFEA; --muted:#9DB0A7; --line:#2A3A34;
  --accent:#E8A04A; --accent-ink:#1A1206; --road:#C9D4CE; --road-dash:#4A5A53; --focus:#6EA8FF; --danger:#FF8A80;
  --s1:#9AABB8; --s2:#6FA3F0; --s3:#AE8AE8; --s4:#E8A04A; --s5:#3CC3CE; --s6:#55C774;
  --s1-bg:#22302F; --s2-bg:#1B2B42; --s3-bg:#2A2340; --s4-bg:#3A2A14; --s5-bg:#123236; --s6-bg:#16331F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hint{color:var(--muted);font-size:15px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:12px;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;margin-right:auto;line-height:1.1}
.brand .mark{width:38px;height:38px;border-radius:10px;background:var(--road);color:var(--ground);display:grid;place-items:center}
.brand small{display:block;font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.03em}
.langs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;border-radius:999px;padding:4px 12px;font-weight:600;font-size:16px;min-height:38px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;min-height:44px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:20px;padding:10px 26px;min-height:56px;justify-content:center}
.btn .i{font-size:20px}

/* landing / login */
.login{display:grid;place-items:center;padding-block:36px}
.login-card{width:100%;max-width:500px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.login-band{background:var(--road);color:var(--ground);padding:22px 26px 18px;display:grid;gap:4px}
.login-band .eyebrow{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;opacity:.8}
.login-band h1{font-size:30px}
.login-band p{margin:0;opacity:.85;font-size:16px;line-height:1.35}
.login-steps{display:flex;height:8px}
.login-steps span{flex:1}
.login-form{padding:24px 26px 26px;display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label{font-weight:600;color:var(--muted)}
.field input{width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 16px;font-size:22px;font-family:var(--f-mono);letter-spacing:.04em}
#vleIn{text-transform:uppercase}
.field input:focus{border-color:var(--focus);outline:none}
.err{color:var(--danger);font-weight:600;min-height:1.4em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px dashed var(--line);background:var(--surface-2);border-radius:999px;padding:6px 14px;font-family:var(--f-mono);font-size:15px;min-height:40px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;padding-block:24px 8px;align-items:center}
.hello{display:grid;gap:12px;align-content:start}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:15px;color:var(--ink)}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big b{font-family:var(--f-display);font-size:clamp(64px,10vw,104px);line-height:.9;font-weight:800}
.big span{font-size:22px;font-weight:600;max-width:17ch;line-height:1.2}
.summary{display:grid;gap:10px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tri div{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;border-top:5px solid var(--c);align-content:start}
.tri b{font-family:var(--f-display);font-size:38px;line-height:1}
.tri span{font-size:15px;color:var(--muted);font-weight:600;line-height:1.2}
.tri small{font-size:13px;color:var(--muted)}
.goal{display:flex;align-items:center;gap:14px;background:var(--s6-bg);border-radius:var(--r);padding:12px 14px}
.goal svg{width:64px;height:64px;flex:none}
.goal p{margin:0;font-weight:600;font-size:18px;line-height:1.25}

/* road */
.section{padding-block:22px 6px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-size:28px}
.sec-head p{margin:0;color:var(--muted)}
.road{position:relative;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:22px 18px 18px}
.road ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;position:relative}
.road ol::before{content:"";position:absolute;left:8%;right:8%;top:38px;height:12px;border-radius:12px;background:var(--road);
  background-image:repeating-linear-gradient(90deg,transparent 0 14px,var(--road-dash) 14px 26px);background-size:100% 2px;background-repeat:no-repeat;background-position:0 5px}
.stop{position:relative;display:grid;justify-items:center;text-align:center;gap:4px;border:2px solid transparent;background:transparent;border-radius:16px;padding:0 4px 10px;width:100%}
button.stop:hover{background:var(--surface-2)}
.stop[aria-pressed="true"]{border-color:var(--c);background:var(--cbg)}
.stop .dot{width:88px;height:88px;border-radius:50%;background:var(--c);color:var(--surface);display:grid;place-items:center;border:6px solid var(--surface);box-shadow:0 0 0 2px var(--c);position:relative}
.stop .dot svg{width:38px;height:38px;stroke-width:2.2}
.stop .step{position:absolute;top:-6px;right:-6px;background:var(--ink);color:var(--ground);border-radius:999px;font-size:13px;font-weight:700;min-width:26px;height:26px;display:grid;place-items:center;border:2px solid var(--surface)}
.stop b{font-family:var(--f-display);font-size:40px;line-height:1;margin-top:6px;color:var(--c)}
.stop .lbl{font-weight:600;font-size:15px;line-height:1.15;min-height:2.3em}
.stop .pct{font-size:13px;color:var(--muted)}
.stop.zero{opacity:.55}
.bar100{display:flex;height:16px;border-radius:999px;overflow:hidden;margin-top:14px;background:var(--surface-2)}
.bar100 i,.sbar i{display:block;height:100%;background:var(--c)}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.side{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.panel{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:grid;gap:10px;min-width:0}
.panel h3{font-size:20px;display:flex;align-items:center;gap:8px}
.co{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:4px;border-radius:10px;width:100%}
.co:hover,.co[aria-pressed="true"]{background:var(--surface-2)}
.co[aria-pressed="true"]{outline:2px solid var(--ink)}
.co .lm{width:34px;height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:15px}
.co .nm{display:block;font-weight:600;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin-top:4px;background:var(--surface-2)}
.co b{font-family:var(--f-display);font-size:22px}
.more{border:0;background:transparent;color:var(--accent);font-weight:700;justify-self:start;padding:4px}

/* finder + candidate cards */
.finder{display:flex;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:6px 8px 6px 16px}
.finder:focus-within{border-color:var(--focus)}
.finder .i{font-size:24px;color:var(--muted)}
.finder input{flex:1;min-width:0;border:0;background:transparent;font-size:19px;padding:10px 0;outline:none}
.active{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;min-height:34px}
.active .count{font-weight:700;font-size:18px;margin-right:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:4px 8px 4px 12px;background:var(--cbg,var(--surface-2));color:var(--ink);font-weight:600;font-size:15px}
.pill .x{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);border-left:6px solid var(--c);min-width:0}
.card-open{display:grid;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:14px;border-radius:18px}
.card-open:hover{background:var(--surface-2)}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.av{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;background:var(--cbg);color:var(--c)}
.card h3{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:15px;min-width:0}
.cmp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.track i{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.track i.on{background:var(--c);border-color:var(--c)}
.track.sm i{height:6px}
.now{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--cbg);color:var(--c);border-radius:999px;padding:3px 12px 3px 8px;font-weight:700;font-size:15px;line-height:1.2}
.badge svg{font-size:18px}
.ids{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;color:var(--muted)}
.ids .mono{color:var(--ink);font-size:14px;overflow-wrap:anywhere}
.apps{border-top:1px solid var(--line);margin:0 14px;padding:4px 0 10px}
.apps summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;padding:8px 0;color:var(--ink)}
.apps summary::-webkit-details-marker{display:none}
.apps summary .chev{transition:transform .15s;font-size:20px}
.apps[open] summary .chev{transform:rotate(180deg)}
.apps ul,.dl-apps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.app-row{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid;gap:6px;border-left:4px solid var(--c)}
.app-row .top-line{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.app-row b{font-size:16px}
.app-row .mono{font-size:13px;color:var(--muted)}
.best{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.empty{background:var(--surface);border-radius:18px;padding:28px;text-align:center;color:var(--muted);font-weight:600;grid-column:1/-1}

/* detail dialog */
dialog{border:0;padding:0;border-radius:24px;max-width:580px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,16,.55)}
.dl{padding:22px;display:grid;gap:16px;max-height:88vh;overflow:auto}
.dl-head{display:flex;gap:14px;align-items:center}
.dl-head .av{width:72px;height:72px;font-size:28px}
.dl-head h2{font-size:28px}
.dl h3{font-size:19px}
.steps{list-style:none;margin:0;padding:0;display:grid}
.steps li{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;position:relative;padding-block:6px}
.steps li::before{content:"";position:absolute;left:23px;top:-6px;bottom:50%;width:3px;background:var(--line)}
.steps li:first-child::before{display:none}
.steps li.done::before,.steps li.cur::before{background:var(--c)}
.steps .d{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--line);background:var(--surface);color:var(--muted);position:relative;z-index:1}
.steps .d svg{width:22px;height:22px}
.steps li.done .d,.steps li.cur .d{background:var(--c);border-color:var(--c);color:var(--surface)}
.steps li.cur .d{box-shadow:0 0 0 6px var(--cbg)}
.steps li span{font-weight:600}
.steps li.up span{color:var(--muted);font-weight:500}
.steps li.cur span{font-size:20px;font-weight:800;color:var(--c)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.facts div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.facts span{font-size:13px;color:var(--muted);font-weight:600}
.facts b{font-size:16px;overflow-wrap:anywhere}
.dl-foot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}

/* admin */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.filters label{display:grid;gap:4px;font-weight:600;font-size:14px;color:var(--muted);min-width:180px;flex:1}
.filters select{border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:17px;color:var(--ink);width:100%}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:16px}
.kpi{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;box-shadow:var(--shadow);border-top:5px solid var(--c,var(--line))}
.kpi b{font-family:var(--f-display);font-size:34px;line-height:1}
.kpi span{font-size:14px;font-weight:600;color:var(--muted);line-height:1.2}
.kpi small{font-size:13px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:15px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td .sbar{height:12px;margin:0;min-width:140px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);margin:10px 0 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.linkish{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0}
.upload{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:14px;color:var(--muted)}
.foot{color:var(--muted);font-size:14px;padding-top:28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:16px}

@media (max-width:1000px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:960px){
  .hero{grid-template-columns:1fr}
  .main{grid-template-columns:1fr}
  .side{position:static}
}
@media (max-width:760px){
  .road ol{grid-template-columns:1fr;gap:6px}
  .road ol::before{left:36px;right:auto;top:30px;bottom:30px;width:12px;height:auto;background-image:none}
  .stop{grid-template-columns:84px 1fr auto;justify-items:start;text-align:left;align-items:center;gap:14px;padding:4px 10px 4px 0}
  .stop b{margin:0;grid-column:3;grid-row:1}
  .stop .lbl{min-height:0;font-size:17px}
  .stop .txt{grid-column:2;grid-row:1}
  .stop .dot{width:84px;height:84px}
  .sec-head h2{font-size:24px}
  .tri{grid-template-columns:1fr}
  .tri div{grid-template-columns:auto 1fr;align-items:center;gap:2px 14px;border-top:0;border-left:6px solid var(--c)}
  .tri b{grid-row:span 2}
}
@media (max-width:480px){
  body{font-size:16px}
  .brand{font-size:17px}
  .langs button{padding:4px 9px}
  .top .btn span{display:none}
  .top .btn{padding:6px 12px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ .card-open,.co{transition:background .15s} }
</style>
</head>

<header class="top"><div class="wrap">

const cv = i => `--c:var(--s${i+1});--cbg:var(--s${i+1}-bg)`;
const initials = n => String(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const $ = s => document.querySelector(s);
const app = $("#app");

/* group application rows into candidates; each candidate is shown at their furthest step */
function groupCandidates(apps){
  const m = new Map();
  apps.forEach(a => { const c = m.get(a.candidate_id) || {id:a.candidate_id, name:a.candidate_name, vle_id:a.vle_id, state:a.vle_location, district:a.vle_district, project:a.project_code, apps:[]}; c.apps.push(a); m.set(a.candidate_id, c); });
  return [...m.values()].map(c => { c.apps.sort((x,y)=>stageIdx(y.status)-stageIdx(x.status) || String(x.company_name).localeCompare(y.company_name)); c.best = stageIdx(c.apps[0].status); c.top = c.apps[0]; return c; });
}
function summarise(cands, apps){
  const counts = STAGE_KEYS.map(()=>0); cands.forEach(c => counts[c.best]++);
  return {counts, people:cands.length, records:apps.length, verified:counts[5], selected:counts[2]+counts[3]+counts[4], applied:counts[0]+counts[1]};
}

/* ---------- data access (server or embedded demo) ---------- */
const api = {
  async login(id, pin){
    if (DEMO){
      if (id === "ADMIN") return {token:"demo", role:"admin", vle_id:"ADMIN"};
      if (!DEMO.applications.some(a => a.vle_id === id)) throw {status:401};
      return {token:"demo", role:"vle", vle_id:id};
    }
    const r = await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vle_id:id,pin})});
    if (!r.ok) throw {status:r.status};
    return r.json();
  },
  async dashboard(vle){
    if (DEMO){
      const target = S.role === "admin" ? vle : S.me;
      const apps = DEMO.applications.filter(a => a.vle_id === target);
      return {vle:{vle_id:target, location:apps[0]?.vle_location||"", district:apps[0]?.vle_district||""}, applications:apps, updated:DEMO.updated};
    }
    return this._get("/api/dashboard" + (vle ? "?vle="+encodeURIComponent(vle) : ""));
  },
  async overview(){
    if (DEMO) return {applications:DEMO.applications, updated:DEMO.updated};
    return this._get("/api/admin/overview");
  },
  async upload(file){
    const fd = new FormData(); fd.append("file", file);
    const r = await fetch("/api/admin/import",{method:"POST",headers:{Authorization:"Bearer "+S.token},body:fd});
    const j = await r.json(); if (!r.ok) throw new Error(j.detail || "Upload failed"); return j;
  },
  async _get(url){
    const r = await fetch(url,{headers:{Authorization:"Bearer "+S.token}});
    if (r.status === 401){ logout(); throw {status:401}; }
    if (!r.ok) throw {status:r.status};
    return r.json();
  }
};

function speak(text){
  try{
    const synth = window.speechSynthesis; if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text), want = T[S.lang].speech, voices = synth.getVoices();
    const v = voices.find(x => x.lang === want) || voices.find(x => x.lang.startsWith(want.slice(0,2))) || (S.lang==="mr" && voices.find(x => x.lang.startsWith("hi")));
    if (v) u.voice = v; u.lang = v ? v.lang : want; u.rate = .92;
    synth.speak(u);
  }catch(e){}
}

async function doLogin(id, pin){
  id = id.trim().toUpperCase(); S.err = "";

async function load(vle){

function ring(j, n){
  const r = 26, c = 2*Math.PI*r, p = n ? j/n : 0;
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--surface)" stroke-width="9"/>
   <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--s6)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/>
   <text x="32" y="37" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)" font-family="Baloo 2, sans-serif">${Math.round(p*100)}%</text></svg>`;
}
function road(s, clickable){
  const tag = clickable ? "button" : "div";
  return `<div class="road"><ol>${STAGE_KEYS.map((_,i)=>`<li><${tag} class="stop ${s.counts[i]?"":"zero"}" ${clickable?`data-stage="${i}" aria-pressed="${S.filter.stage===i}"`:""} style="${cv(i)}">

}
const stackBar = counts => { const n = counts.reduce((a,b)=>a+b,0)||1; return `<span class="sbar">${counts.map((c,i)=>c?`<i style="${cv(i)};width:${c/n*100}%"></i>`:"").join("")}</span>`; };
const badge = i => `<span class="badge" style="${cv(i)}">${ic("s"+(i+1))}${stLabel(i)}</span>`;
const track = (i, cls="") => `<span class="track ${cls}" aria-hidden="true" style="${cv(i)}">${STAGE_KEYS.map((_,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</span>`;

  </div></section>`;

  $("#fState").onchange = e => { S.af.state = e.target.value; S.af.district = ""; renderAdmin(); };
  $("#fDist").onchange = e => { S.af.district = e.target.value; renderAdmin(); };
  $("#fReset").onclick = () => { S.af = {state:"",district:""}; renderAdmin(); };
  app.querySelectorAll("[data-area]").forEach(r => r.onclick = () => { if (level==="state"){ S.af.state = r.dataset.area; S.af.district=""; } else S.af.district = r.dataset.area; renderAdmin(); window.scrollTo({top:0}); });
  app.querySelectorAll("[data-vle]").forEach(r => r.onclick = () => load(r.dataset.vle));
  $("#upBtn").onclick = async () => {
    const file = $("#xl").files[0]; if (!file) return;
    $("#upMsg").textContent = "Uploading…";
    try{ const r = await api.upload(file); $("#upMsg").textContent = `Loaded ${r.rows} applications from ${r.candidates} candidates across ${r.vles} VLEs.` + (r.warnings.length?` Warnings: ${r.warnings.slice(0,5).join("; ")}`:""); S.overview = await api.overview(); setTimeout(renderAdmin, 1800); }
    catch(e){ $("#upMsg").textContent = e.message; }
  };
}

/* ---------- router ---------- */
function render(){
  renderChrome();
  if (!S.token) return renderLogin();
  if (S.data) return renderDashboard();
  if (S.role === "admin" && S.overview) return renderAdmin();
  app.innerHTML = `<p class="hint" style="padding:40px 0">${esc(S.err)||"…"}</p>`;
}
if ("speechSynthesis" in window) speechSynthesis.getVoices();
render();
if (S.token) load();
})();
</script>
</body>
</html>
